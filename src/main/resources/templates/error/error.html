<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 발생</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .error-card {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #fa5252;
            margin: 0;
            line-height: 1;
        }
        .error-message {
            font-size: 18px;
            color: #495057;
            margin: 20px 0 30px;
            word-break: keep-all; /* 단어 단위로 줄바꿈 */
        }
        .btn-home {
            display: inline-block;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-home:hover {
            background-color: #004085;
        }
        .btn-back {
            display: inline-block;
            background-color: #f1f3f5;
            color: #495057;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-left: 10px;
            border: none;
            cursor: pointer;
        }
        .btn-back:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

<div class="error-card">
    <h1 class="error-code" th:text="${statusCode}">500</h1>

    <p class="error-message" th:text="${errorMessage}">요청하신 작업을 처리할 수 없습니다.</p>

    <div>
        <button class="btn-back" onclick="history.back()">뒤로 가기</button>
        <a th:href="@{/projects}" class="btn-home">홈으로</a>
    </div>
</div>

</body>
</html>
